# Render Blueprint — provisions the CartIQ API only.
# Postgres is external (Neon) and Redis is external (Upstash/Redis Cloud); set
# DATABASE_URL and REDIS_URL in the dashboard.
#
# Why the database isn't defined here: Render's free Postgres is suspended 30
# days after creation, which took the whole service down (alembic can't connect
# -> the start command short-circuits -> failed deploy). Neon's free tier has no
# such expiry, and keeping the DB out of the blueprint means any managed
# Postgres can back the app.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cartiq-api
    runtime: python
    rootDir: services/api
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Run migrations, then start the server. Render sets $PORT.
    startCommand: "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates a strong secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: QUICKCOMMERCE_BASE_URL
        value: https://api.quickcommerceapi.com
      # Enforced by the blueprint so a deploy can't silently flip it back.
      # "false" = live QuickCommerce API. Change here (not just the dashboard).
      - key: USE_MOCK_QC
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: CACHE_TTL_SECONDS
        value: "1800"
      # The MCP transport rejects any Host header not listed here (DNS-rebinding
      # protection), so the public hostname must be present or /mcp returns 421.
      # Add any custom domain here too.
      - key: MCP_ALLOWED_HOSTS
        value: cartiq-api.onrender.com
      # Daily spend ceilings, enforced across all callers (services/budget.py).
      # qc_searches matters most: the MCP endpoint is unauthenticated, and each
      # search costs one QuickCommerce credit per platform.
      - key: DAILY_QC_SEARCHES
        value: "200"
      - key: DAILY_GEMINI_REQUESTS
        value: "500"
      - key: DAILY_GROUNDED_SEARCHES
        value: "150"
      # Secrets / values set in the dashboard (sync:false = not stored in git):
      # Neon postgresql:// URL. Paste it verbatim — config.py rewrites the
      # scheme to asyncpg and drops the sslmode/channel_binding params that
      # asyncpg rejects.
      - key: DATABASE_URL
        sync: false
      - key: QUICKCOMMERCE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL # Upstash rediss:// URL
        sync: false
      - key: CORS_ORIGINS # your Vercel URL, e.g. https://cartiq.vercel.app
        sync: false
